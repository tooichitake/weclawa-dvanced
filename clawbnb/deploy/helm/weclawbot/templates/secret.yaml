{{- /*
Secret for weclawbot daemon — holds the AES master key
(`WECLAWBOT_DB_KEY`) and the Postgres DSN (`WECLAWBOT_PG_URL`).

Operators have three choices:

 1. Set `secrets.create=true` (default) + put base64 values directly in
    `secrets.data.*`. **Dev/staging only** — keys end up in
    `helm get values` output.

 2. Set `secrets.create=true` + leave placeholders, then create the
    Secret out-of-band with kubectl + sealed-secrets/external-secrets-
    operator. The placeholder Secret still gets created so the
    Deployment's `envFrom.secretRef` doesn't dangle.

 3. Set `secrets.existingSecret=<name>` to skip our Secret entirely and
    point the Deployment at an externally-managed one. Production
    pattern with HashiCorp Vault / GCP Secret Manager / AWS Secrets
    Manager via the secrets-store-csi-driver.

For option 3, the values.yaml is wired to read `daemon.envFrom` so the
Deployment template doesn't need branching.
*/}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: weclawbot-secrets
  labels:
    {{- include "weclawbot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
