{{- /*
ConfigMap holding the daemon's runtime config (`config.json`) +
optionally the OTel collector config when otelCollector.enabled.

The daemon Deployment mounts the config under
`/root/.weclawbot/config.json`. Operators can also override at runtime
via env vars (`WECLAWBOT_*`) which take priority — the ConfigMap is the
baseline.
*/}}
{{- if .Values.daemon.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weclawbot.fullname" . }}-config
  labels:
    {{- include "weclawbot.labels" . | nindent 4 }}
data:
  config.json: |
{{- $cfg := dict
  "compliance" (dict
    "mode" .Values.daemon.complianceMode
  )
  "rate_limit" (dict
    "user_per_minute" .Values.daemon.rateLimitUserPerMinute
  )
}}
{{ toJson $cfg | indent 4 }}
{{- end }}
{{- if .Values.otelCollector.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weclawbot.fullname" . }}-otel-collector
  labels:
    {{- include "weclawbot.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Generated by the weclawbot Helm chart. Edit values.otelCollector
    # to change. See https://opentelemetry.io/docs/collector/configuration/
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

    exporters:
      {{- if .Values.otelCollector.exporters.tempo.endpoint }}
      otlp/tempo:
        endpoint: {{ .Values.otelCollector.exporters.tempo.endpoint | quote }}
        tls:
          insecure: true
      {{- end }}
      {{- if .Values.otelCollector.exporters.jaeger.endpoint }}
      otlp/jaeger:
        endpoint: {{ .Values.otelCollector.exporters.jaeger.endpoint | quote }}
        tls:
          insecure: true
      {{- end }}
      # Always include a debug exporter so misconfig is visible in the
      # collector's stdout (kubectl logs).
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters:
            - debug
            {{- if .Values.otelCollector.exporters.tempo.endpoint }}
            - otlp/tempo
            {{- end }}
            {{- if .Values.otelCollector.exporters.jaeger.endpoint }}
            - otlp/jaeger
            {{- end }}
{{- end }}
