{{- if .Values.daemon.enabled }}
# weclawbot daemon Deployment. EXPERIMENTAL — requires privileged: true
# because the per-user sandbox tier uses podman+runsc inside the Pod.
# Production deployments should run weclawbot on a dedicated Linux VM
# with systemd; this Deployment is for dev/staging convenience only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weclawbot.fullname" . }}
  labels:
    {{- include "weclawbot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.daemon.replicas }}
  selector:
    matchLabels:
      {{- include "weclawbot.selectorLabels" . | nindent 6 }}
  strategy:
    # weclawbot is stateful (process-global pools, active poller loops);
    # rolling updates would create two daemons polling the same iLink
    # bot tokens concurrently → message duplication. Use Recreate.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "weclawbot.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: weclawbot
          image: "{{ .Values.daemon.image.repository }}:{{ .Values.daemon.image.tag }}"
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          command: ["weclawbot", "start", "--port", "18011", "--bind", "0.0.0.0"]
          env:
            - name: WECLAWBOT_COMPLIANCE_MODE
              value: {{ .Values.daemon.complianceMode | quote }}
          {{- with .Values.daemon.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 18011
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          securityContext:
            privileged: true  # required for podman-in-pod + runsc
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: state
              mountPath: /root/.weclawbot
            - name: cgroup
              mountPath: /sys/fs/cgroup
            # Read-only baseline config.json — mounted under the state
            # PVC's path so the daemon's `state_dir` resolver picks it
            # up. Runtime updates via PUT /config write to the PVC
            # copy and override.
            - name: config
              mountPath: /etc/weclawbot
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "weclawbot.fullname" . }}-state
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: config
          configMap:
            name: {{ include "weclawbot.fullname" . }}-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "weclawbot.fullname" . }}-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weclawbot.fullname" . }}
spec:
  type: {{ .Values.daemon.service.type }}
  selector:
    {{- include "weclawbot.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.daemon.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
