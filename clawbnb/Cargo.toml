[package]
name = "weclawbot"
version = "0.1.0"
edition = "2024"
description = "Standalone WeChat-to-AI message bridge with multi-tenant isolation"
license = "MIT"

# `weclawbot-mcp` (stdio JSON-RPC MCP server baked into the sandbox image)
# lives as a sibling standalone Cargo package at ./weclawbot-mcp/. Keeping it
# out of this package's [[bin]] list means the Docker mcp-builder stage can
# compile it without dragging in tokio/reqwest/axum/etc.

[features]
default = []
# v2.2 L4.1 (deferred to v3): ACP (Agent Client Protocol) — long-running
# claude session per user via stdio JSON-RPC, instead of spawning a fresh
# container + claude-cli per inbound message. Reduces cold-start latency
# from 800ms+ to ~100ms but requires claude-cli stdio long-session support,
# which is still evolving upstream. The flag exists so v3 can flip default
# = ["acp"] when the protocol stabilises; v2.2 ships with per-message
# containers as before.
acp = []

# v5.6: postgres feature flag deleted — PG is now the always-on backend.
# To run weclawbot, set WECLAWBOT_PG_URL (or DATABASE_URL) and ensure
# Postgres 13+ is reachable. The sqlx/postgres feature is always on
# (see [dependencies].sqlx below).

# v5.2 O3 — Discord Gateway WebSocket support.
discord-gateway = ["dep:tokio-tungstenite", "dep:futures"]

# v3 Enterprise Edition — `ee/` 子树 (PostHog 模式)。MIT 主线保持精简，
# ee/ 下放 SSO/SAML/SLA monitoring/advanced RBAC 等"商业级"特性。
# 默认 off，hosted SaaS 部署时 `--features ee` 编进 binary。Open-source
# 用户使用核心功能不受影响。当前 ee 子模块只搭骨架（无实际 SSO 实现），
# v3 PR 增量补全。
ee = ["dep:jsonwebtoken", "dep:rsa", "dep:x509-parser"]

# v3 OpenTelemetry — distributed tracing via OTLP exporter (default to
# stdout in dev, configurable endpoint in prod). 多租户 SaaS 跨 service
# 追踪用。Prometheus metrics 不被替代，仍然存在；OTel 是叠加层。
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
dirs = "6"
sha1 = "0.10"
# Phase 6.4: SHA-256 用作新用户的 short-hash 来源。SHA-1 在这里
# 只是 de-dup 不是 crypto，所以技术上不算安全升级 —— 但保留
# Sha1 在 deps 树里会让 cargo audit/license review 多解释一次，
# 切换更省心。
sha2 = "0.10"
# v2.1.A4: webhook HMAC signature (Stripe-style X-Weclawbot-Signature header).
hmac = "0.12"
# v2.1.B1: Config 热缓存。daemon 启动时 load 一次，notify watcher 监听
# config.json mtime 变化，ArcSwap::store 一刹那切换。读取 = atomic load + clone Arc。
arc-swap = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors", "limit", "fs"] }
# v5.4 L5.1: assets/console/ 拆分后嵌入 binary 让 single-file 部署不破。
# operator override 仍走 ~/.weclawbot/console/ 路径（如有），fs override
# 用 tower_http::services::ServeDir 挂载；fallback 通过本 crate 的
# include_dir!() 把 assets/console/ 全部 embed 进 binary。
include_dir = "0.7"
urlencoding = "2"
aes = "0.8"
hex = "0.4"
md-5 = "0.10"
portable-pty = "0.9"
vt100 = "0.16"
regex = "1"
# v5.5 PII pipeline — needs lookbehind/lookahead for "not preceded/followed
# by digit" (regex crate refuses lookaround on principle). fancy-regex
# (3M+ downloads/mo, fancy-regex/fancy-regex) supports them via Boyer-Moore
# fallback. Pure Rust, no external deps.
fancy-regex = "0.13"

# v5.5 — Tenant export bundle (.tar.gz).
# `tar` is the canonical Rust tar reader/writer (5M+ downloads/mo, pure
# Rust). `flate2` is the de-facto gzip codec (12M+ downloads/mo). Both
# work together via the GzEncoder wrapping a tar::Builder<File>.
tar = "0.4"
flate2 = "1"
url = "2"

# v7.0: PG-only, native types (JSONB / UUID / TIMESTAMPTZ).
# - `chrono`: read/write TIMESTAMPTZ as chrono::DateTime<Utc>
# - `uuid`: read/write UUID columns as uuid::Uuid
# - `json`: read/write JSONB as serde_json::Value or sqlx::types::Json
#   (already implicit via serde_json dep, but explicit feature enables
#   query_as decoding)
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "json",
] }

# v7.0 sqlite import path retired. rusqlite removed; legacy SQLite users
# stuck on pre-v5.6 must `git checkout v5.6 && weclawbot import-sqlite ...`
# first, then upgrade to v7. Documented in CLAUDE.md.
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

# Phase 3: admin API key bootstrap + bearer authentication.
# argon2 is the password-hashing standard (winner of PHC competition,
# RFC 9106). We use argon2id with default params + per-key random salt;
# verify is constant-time. data-encoding gives us Crockford-friendly
# base32 for human-typable key prefixes.
argon2 = "0.5"
data-encoding = "2"
futures-util = "0.3"

# Phase 4: observability. `metrics` is the standard Rust metrics facade
# (similar role to `tracing` for logging); `metrics-exporter-prometheus`
# converts the in-process registry into a Prometheus scrape endpoint.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# v2.2 L2.1 / L2.2: trait 抽象（MessagingPlatform / ReplyProvider）。
# Rust async-in-trait (RFC 3185) 在 1.75 stable 后官方支持但有些限制
# （不支持 dyn-compatibility 直接 Box<dyn>），所以为了能写 trait
# object（Box<dyn ReplyProvider> 用于 dispatch chain）继续用 async-trait。
async-trait = "0.1"

# Phase 6.1: token-at-rest encryption. `aes-gcm` provides AES-256-GCM
# (authenticated encryption with associated data) per NIST SP 800-38D.
# Every token row gets a unique 96-bit random nonce; reusing a (key,
# nonce) pair would catastrophically break AES-GCM, so we hard-fail
# rather than risk it.
aes-gcm = "0.10"

# v3 OTel — optional, enabled via `--features otel`. opentelemetry has
# a churny API surface so we pin via the otel feature set, not as a
# default dep — keeps non-OTel deployments lean. tracing-opentelemetry
# bridges `tracing` spans into OTel spans.
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }

# v3.5 H1 — OIDC id_token signature verification. Only pulled in with
# `--features ee` since OIDC SSO is enterprise-only (open-source users
# stick with admin keys). JWKS endpoint fetch is via reqwest (already
# in tree); jsonwebtoken handles RS256/ES256 verify.
jsonwebtoken = { version = "9", optional = true }

# v5.4 N4 — SAML XML signature verify dependencies (only with `--features ee`).
# `rsa` is the standard pure-Rust RSA crate (3M+ downloads/mo); `x509-parser`
# is the canonical X.509 PEM/DER parser (5M+ downloads/mo). Together they let
# us extract the IdP's RSA pubkey from the cert and verify
# RSA-PKCS#1-v1_5-SHA256 over SignedInfo bytes. C14N canonicalization is the
# remaining gap — see `ee::saml` docstring for SP-proxy production guidance.
rsa = { version = "0.9", optional = true, features = ["sha2"] }
x509-parser = { version = "0.16", optional = true }

# v5.2 O3 — Discord Gateway WebSocket. tokio-tungstenite 是 tungstenite
# 的 tokio async wrapper，rustls-tls 让 binary 不依赖系统 OpenSSL。
# 用 `discord-gateway` feature gate 避免主线 binary 都强加 ~500KB ws 依赖。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# v7.0 — per-test PG isolation via testcontainers. The bare crate handles
# container lifecycle (start on first use, stop at process exit);
# `testcontainers-modules/postgres` gives a typed `Postgres` image
# (5M+ downloads/mo combined). Each test calls `open_in_memory()` which
# creates a fresh database inside the shared container — fully isolated
# at the DB level, no cross-test row contamination.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
