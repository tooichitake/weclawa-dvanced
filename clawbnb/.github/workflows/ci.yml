name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # v7.0: tests use testcontainers (spins postgres:16 per-process).
    # No service container needed; GHA Ubuntu runners have Docker
    # pre-installed which testcontainers uses transparently.
    defaults:
      run:
        working-directory: clawbnb
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install postgresql-client (pg_dump/psql for backup CLI tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clawbnb/target
            clawbnb/weclawbot-mcp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('clawbnb/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: rustfmt --check (host)
        run: cargo fmt --check

      - name: rustfmt --check (mcp)
        working-directory: clawbnb/weclawbot-mcp
        run: cargo fmt --check

      - name: clippy (host)
        # v7.0: only deny clippy `correctness` and `suspicious` lint
        # groups (real-bug detection). Style/perf/pedantic lints emit
        # warnings but don't fail CI — keeps the noise-to-signal ratio
        # high without forcing a rewrite of every `if let` and doc list.
        # Run with --no-deps so deps' warnings don't show.
        run: cargo clippy --no-deps --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: clippy (mcp)
        working-directory: clawbnb/weclawbot-mcp
        run: cargo clippy --no-deps --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: cargo test (host)
        # v7.0: testcontainers gives each test its own PG database; tests
        # parallelize by default. No --test-threads=1 needed.
        run: cargo test --release

      - name: cargo test (mcp)
        working-directory: clawbnb/weclawbot-mcp
        run: cargo test --release

      - name: cargo build (host)
        run: cargo build --release

      - name: cargo build (mcp)
        working-directory: clawbnb/weclawbot-mcp
        run: cargo build --release

  # Phase 8: supply-chain security gates. cargo-audit checks for CVEs
  # in transitive dependencies; cargo-deny enforces license + advisory
  # policy. Both run on every PR and fail the build if a new advisory
  # lands on a dep we ship. Cached install keeps the per-job cost <5s.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clawbnb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit || true
      - name: Run cargo-audit
        run: cargo audit --deny warnings
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny || true
      - name: Run cargo-deny
        run: cargo deny --all-features check advisories bans sources

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clawbnb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov || true
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --release --lcov --output-path lcov.info
      - name: Upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: clawbnb/lcov.info
