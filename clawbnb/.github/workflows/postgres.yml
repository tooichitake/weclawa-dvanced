name: Postgres backend (v5.3)

# v5.3 final: 跑 `cargo test --features postgres` 真启用 PG 后端。
#
#   1. `AsyncDbPool` cfg-gated typealias 切到 `sqlx::PgPool`
#   2. 所有 11 repo 用 `AsyncDbPool` 字段类型 (mechanic swap 完成)
#   3. Migration runner `portable_ddl()` SQL 重写：`INTEGER PRIMARY KEY
#      AUTOINCREMENT` → `BIGSERIAL PRIMARY KEY`
#   4. `?` placeholder + `ON CONFLICT` + `RETURNING id` 跨 driver portable
#   5. Backup/restore 走 `pg_dump`/`psql` 外部命令
#
# Postgres testcontainer 在 services: 下起，env DATABASE_URL 注入；
# `open_in_memory()` 的 PG-feature 变体直接连 `DATABASE_URL` 跑 fresh
# schema (per-process 共享 DB；test isolation 通过 sqlx pool 限制 +
# 顺序运行)。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weclawbot
          POSTGRES_PASSWORD: weclawbot
          POSTGRES_DB: weclawbot_test
        ports:
          - 5432:5432
        # health check ensures the runner waits until PG accepts connections
        options: >-
          --health-cmd "pg_isready -U weclawbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # sqlx tests pick up DATABASE_URL when running against postgres pool
      DATABASE_URL: postgres://weclawbot:weclawbot@localhost:5432/weclawbot_test
      WECLAWBOT_PG_URL: postgres://weclawbot:weclawbot@localhost:5432/weclawbot_test
    defaults:
      run:
        working-directory: clawbnb
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install postgres client (pg_dump/psql for backup CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clawbnb/target
          key: cargo-pg-${{ runner.os }}-${{ hashFiles('clawbnb/**/Cargo.lock') }}
          restore-keys: cargo-pg-${{ runner.os }}-

      - name: cargo build --features postgres
        run: cargo build --release --features postgres

      - name: cargo test --features postgres
        # v5.3 final: 所有 repo 已切 `AsyncDbPool`，本 step 真跑 PG 后端
        # 测试 (open_in_memory() 在 postgres feature 下连 DATABASE_URL)。
        # --test-threads=1 因为 PG 共享一份 schema，per-test 数据 race 隔离
        # 通过顺序运行 (不是真 isolation；follow-up 用 testcontainers crate
        # 给每个测试一份独立 DB)。
        run: cargo test --release --features postgres -- --test-threads=1

      - name: cargo build all feature combinations
        # 健康检查：所有 feature 组合编译。失败会捕获 cfg-gating
        # （portable_ddl / backup.rs / AsyncDbPool typealias）破坏单一
        # build 的 case。
        run: |
          cargo build --release
          cargo build --release --features acp
          cargo build --release --features ee
          cargo build --release --features otel
          cargo build --release --features discord-gateway
          cargo build --release --features postgres
          cargo build --release --features "ee,otel"
          cargo build --release --features "postgres,discord-gateway"
