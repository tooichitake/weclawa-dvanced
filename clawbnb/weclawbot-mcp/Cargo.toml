[package]
name = "weclawbot-mcp"
version = "0.1.0"
edition = "2024"
description = "Stdio JSON-RPC MCP server for weclawbot sandbox — exposes attach/attach_url tools to Claude"
license = "MIT"

# Standalone package, intentionally NOT a workspace member of the parent
# weclawbot crate. Keeping it independent lets the sandbox Docker image build
# this binary in isolation, without dragging tokio/reqwest/axum into its
# dependency graph (~200KB binary instead of ~20MB compile-time pull).

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
